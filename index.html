<meta charset="utf-8">
<title>무기 25강 시뮬레이터</title>
<link rel="stylesheet" href="assets/common.css" />
<style>
  .hero{
    position:absolute;
    left:-5.725cqw; top:14.885cqw;
    width:111.705cqw; height:159.669cqw;
    object-fit:fill;
  }
  .hero-fade{
    position:absolute; left:0; top:0;
    width:100cqw; height:59.815cqw;
    background:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
  }
  .credit{ top:171.555cqw; }
</style>

<div class="viewport">
  <div class="frame" id="frame">
    <img class="hero" src="assets/hero.webp" alt="" />
    <div class="hero-fade"></div>
    <img class="logo" src="assets/logo.webp" alt="Lost Ark" />
    <h1 class="title">무기 25강 시뮬레이터</h1>
    <p class="credit">made by. 따순미</p>
    <div class="actions">
      <button class="action-btn" id="loginBtn">
        <img src="assets/icon-login.png" alt="" />
        <span>로그인</span>
      </button>
      <button class="action-btn" id="rankBtn">
        <img src="assets/icon-rank.png" alt="" />
        <span>순위보기</span>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  document.getElementById('loginBtn').addEventListener('click', function(){
    location.href = 'login.html';
  });
  document.getElementById('rankBtn').addEventListener('click', function(){
    location.href = 'rank.html';
  });
})();
</script>
