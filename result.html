<meta charset="utf-8">
<title>재련 결과 확인 - 무기 25강 시뮬레이터</title>
<script>
  if (!sessionStorage.getItem('jgb_session') || !sessionStorage.getItem('jgb_run')) { location.href = 'forge.html'; }
</script>
<link rel="stylesheet" href="assets/common.css" />
<script type="module" src="assets/firebase-init.js?v=2"></script>
<script type="module" src="assets/game.js?v=3"></script>
<style>
  .frame{ background:#08070a; }
  .bg{
    position:absolute; left:0; top:0;
    width:100cqw; height:207.638cqw;
    object-fit:cover;
  }
  .bottom-fade{
    position:absolute; left:0; top:182.463cqw;
    width:100cqw; height:34.351cqw;
    background:linear-gradient(to bottom, transparent 0%, #000000 100%);
  }
  .prompt{
    position:absolute;
    left:0; top:120.865cqw;
    width:100cqw;
    margin:0;
    text-align:center;
    font-weight:700;
    font-size:5.089cqw;
    color:#fff8e6;
    text-shadow:0 0.509cqw 0.509cqw rgba(0,0,0,0.25);
  }
  .reveal-btn{
    position:absolute;
    left:5.089cqw; top:141.730cqw;
    width:89.822cqw; height:15.267cqw;
    border:none; cursor:pointer;
    background:var(--btn-bg);
    box-shadow:inset 0 0.254cqw 0.509cqw rgba(255,255,255,0.25);
    color:#dedede;
    font-family:inherit;
    font-size:5.089cqw; font-weight:500;
    text-shadow:0 0.509cqw 0.509cqw rgba(0,0,0,0.25);
  }
  .reveal-btn:hover{ background:var(--btn-bg-hover); }
  .reveal-btn:active{ transform:translateY(1px) scale(0.995); }
</style>

<div class="viewport">
  <div class="frame">
    <img class="bg" src="assets/result-bg.png" alt="" />
    <div class="bottom-fade"></div>
    <p class="prompt">버튼을 클릭해 재련 결과를 확인하세요.</p>
    <button class="reveal-btn" id="revealBtn">결과 확인</button>
  </div>
</div>

<script type="module">
(function(){
  "use strict";
  var G = window.JGB_GAME;
  document.getElementById('revealBtn').addEventListener('click', function(){
    var run = G.getRun();
    if(!run){ location.href = 'forge.html'; return; }

    if(run.mode === 'auto'){
      location.href = 'result-success.html';
      return;
    }

    var success = G.attemptOnce(run);
    location.href = success ? 'result-success.html' : 'result-fail.html';
  });
})();
</script>
