<meta charset="utf-8">
<title>재련 성공 - 무기 25강 시뮬레이터</title>
<script>
  if (!sessionStorage.getItem('jgb_session') || !sessionStorage.getItem('jgb_run')) { location.href = 'forge.html'; }
</script>
<link rel="stylesheet" href="assets/common.css" />
<script type="module" src="assets/firebase-init.js?v=2"></script>
<script type="module" src="assets/game.js?v=2"></script>
<style>
  .frame{ background:#08070a; }

  .art-composite{
    position:absolute;
    left:0; top:0;
    width:100.064cqw; height:140.070cqw;
    object-fit:fill;
  }

  .stat{
    position:absolute;
    left:0; width:100cqw;
    margin:0;
    text-align:center;
    font-weight:700;
    color:#dedede;
    text-shadow:0 0.509cqw 0.509cqw rgba(0,0,0,0.25);
  }
  #gaugeStat{ top:111.450cqw; font-size:4.071cqw; line-height:1.5; }
  #gaugeStat .reg{ font-weight:400; }
  #triesStat, #percentileStat, #goldStat{
    font-size:5.089cqw;
    text-shadow:0 0.509cqw 0.509cqw rgba(0,0,0,0.25), 0 0.509cqw 3.690cqw rgba(20,157,255,0.95);
  }
  #triesStat{ top:130.789cqw; }
  #percentileStat{ top:139.186cqw; }
  #goldStat{ top:147.583cqw; }
  #summaryStat{
    top:162.341cqw; font-size:3.562cqw; font-weight:400;
    color:#8c8c8c; line-height:1.5;
  }
</style>

<div class="viewport">
  <div class="frame">
    <img class="art-composite" src="assets/success-composite.png" alt="" />

    <p class="stat" id="gaugeStat"></p>
    <p class="stat" id="triesStat"></p>
    <p class="stat" id="percentileStat"></p>
    <p class="stat" id="goldStat"></p>
    <p class="stat" id="summaryStat"></p>

    <p class="credit">made by. 따순미</p>
    <div class="actions">
      <button class="action-btn" id="retryBtn">
        <img src="assets/icon-retry.png" alt="" />
        <span>다시하기</span>
      </button>
      <button class="action-btn" id="rankBtn">
        <img src="assets/icon-rank.png" alt="" />
        <span>순위보기</span>
      </button>
    </div>
  </div>
</div>

<script type="module">
(function(){
  "use strict";
  var G = window.JGB_GAME;
  var run = G.getRun();
  if(run){
    var session = null;
    try{ session = JSON.parse(sessionStorage.getItem('jgb_session') || 'null'); }catch(e){}
    if(session && session.nickname){
      G.submitResult({
        nickname: session.nickname,
        server: session.server,
        job: session.job,
        tries: run.tries,
        gauge: run.gauge
      });
    }
    var pct = G.percentile(run.tries);
    document.getElementById('gaugeStat').innerHTML =
      '장인의 기운 ' + run.gauge.toFixed(2) + '%<span class="reg">를 쌓고</span><br>' +
      '<span class="reg">강화에 성공했습니다!</span>';
    document.getElementById('triesStat').textContent =
      '강화 시도 횟수 ' + run.tries + '회';
    document.getElementById('percentileStat').textContent =
      '전체 상위 ' + pct.toFixed(1) + '%';
    document.getElementById('goldStat').textContent =
      '총 사용 골드 ' + (run.tries * G.GOLD_PER_TRY).toLocaleString() + 'G';
    document.getElementById('summaryStat').innerHTML =
      '평균 강화 시도 횟수는 ' + Math.round(G.AVG_TRIES) + '회,<br>' +
      '전체 장기백 비율은 ' + G.JANGIBAEK_RATE.toFixed(1) + '% 입니다.';
  }

  document.getElementById('retryBtn').addEventListener('click', function(){
    sessionStorage.removeItem('jgb_run');
    location.href = 'forge.html';
  });
  document.getElementById('rankBtn').addEventListener('click', function(){
    location.href = 'rank.html';
  });
})();
</script>
