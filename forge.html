<meta charset="utf-8">
<title>장비 재련 - 무기 25강 시뮬레이터</title>
<script>
  if (!sessionStorage.getItem('jgb_session')) { location.href = 'login.html'; }
</script>
<link rel="stylesheet" href="assets/common.css" />
<script type="module" src="assets/firebase-init.js?v=2"></script>
<script type="module" src="assets/game.js?v=3"></script>
<style>
  .bg{
    position:absolute; left:0; top:0;
    width:100cqw; height:210.564cqw;
    object-fit:cover;
  }
  .bg-fade{
    position:absolute; left:0; top:149.491cqw;
    width:100cqw; height:67.303cqw;
    background:linear-gradient(to bottom, transparent 0%, #121211 6.73%);
  }
  .gauge-banner{
    position:absolute;
    left:0.382cqw; top:71.375cqw;
    width:101.150cqw; height:4.708cqw;
    object-fit:fill;
  }
  .mid-art{
    position:absolute;
    left:0.127cqw; top:25.827cqw;
    width:100cqw; height:25.445cqw;
    object-fit:fill;
  }
  .badge{
    position:absolute;
    left:35.522cqw; top:25.216cqw;
    width:29.084cqw; height:29.211cqw;
    object-fit:fill;
  }

  .mode-btn{
    position:absolute;
    left:5.089cqw; width:89.822cqw; height:15.267cqw;
    border:none; cursor:pointer;
    background:var(--btn-bg);
    box-shadow:inset 0 0.254cqw 0.509cqw rgba(255,255,255,0.25);
    color:#dedede;
    font-family:inherit;
    font-size:5.089cqw; font-weight:500;
    text-shadow:0 0.509cqw 0.509cqw rgba(0,0,0,0.25);
  }
  .mode-btn:hover{ background:var(--btn-bg-hover); }
  .mode-btn:active{ transform:translateY(1px) scale(0.995); }
  #manualBtn{ top:141.730cqw; }
  #autoBtn{ top:160.051cqw; }

  .gauge-display{
    position:absolute;
    left:0; top:71.375cqw;
    width:100cqw;
    margin:0;
    text-align:center;
    font-weight:500;
    font-size:4.071cqw;
    color:#dedede;
    text-shadow:0 0.509cqw 0.509cqw rgba(0,0,0,0.25);
  }
</style>

<div class="viewport">
  <div class="frame">
    <img class="bg" src="assets/forge-bg.webp" alt="" />
    <img class="mid-art" src="assets/forge-mid.webp" alt="" />
    <img class="badge" src="assets/fail-badge.webp" alt="" />
    <div class="bg-fade"></div>
    <img class="gauge-banner" src="assets/gauge-banner.webp" alt="" />

    <p class="gauge-display" id="gaugeDisplay">장인의 기운 0.00%</p>
    <button class="mode-btn" id="manualBtn">장비 재련</button>
    <button class="mode-btn" id="autoBtn">25강 자동 재련</button>

    <div class="actions">
      <button class="action-btn" id="homeBtn">
        <img src="assets/icon-home.png" alt="" />
        <span>처음으로</span>
      </button>
      <button class="action-btn" id="rankBtn">
        <img src="assets/icon-rank.png" alt="" />
        <span>순위보기</span>
      </button>
    </div>
  </div>
</div>

<script type="module">
(function(){
  "use strict";
  var G = window.JGB_GAME;
  var existing = G.getRun();
  document.getElementById('gaugeDisplay').textContent =
    '장인의 기운 ' + (existing ? existing.gauge.toFixed(2) : '0.00') + '%';

  document.getElementById('homeBtn').addEventListener('click', function(){
    location.href = 'index.html';
  });
  document.getElementById('rankBtn').addEventListener('click', function(){
    location.href = 'rank.html';
  });
  document.getElementById('manualBtn').addEventListener('click', function(){
    G.getOrStartRun('manual');
    location.href = 'result.html';
  });
  document.getElementById('autoBtn').addEventListener('click', function(){
    var run = G.getOrStartRun('auto');
    G.resolveAuto(run);
    location.href = 'result.html';
  });
})();
</script>
