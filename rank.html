<meta charset="utf-8">
<title>전체 순위 - 무기 25강 시뮬레이터</title>
<link rel="stylesheet" href="assets/common.css" />
<script type="module" src="assets/firebase-init.js?v=2"></script>
<script type="module" src="assets/game.js?v=3"></script>
<style>
  .frame{ background:#08070a; }

  .rank-title{
    position:absolute;
    left:0; top:14.885cqw;
    width:100cqw;
    margin:0;
    text-align:center;
    font-weight:700;
    font-size:5.089cqw;
    color:#dedede;
    text-shadow:0 0.509cqw 0.509cqw rgba(0,0,0,0.25);
  }
  .rank-summary{
    position:absolute;
    left:0; top:26.590cqw;
    width:100cqw;
    margin:0;
    text-align:center;
    font-weight:500;
    font-size:3.563cqw;
    line-height:1.5;
    color:#8c8c8c;
    text-shadow:0 0.509cqw 0.509cqw rgba(0,0,0,0.25);
  }

  .rank-table{
    position:absolute;
    left:5.089cqw; top:41.349cqw;
    width:89.822cqw;
  }
  .rank-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:1.018cqw;
    height:10.178cqw;
    color:#dedede;
    font-size:2.799cqw;
    text-shadow:0 0.509cqw 0.509cqw rgba(0,0,0,0.25);
  }
  .rank-row.header{ background:#28292e; font-weight:400; }
  .rank-row.me{ background:rgba(255,255,255,0.1); }
  .rank-row .div{ width:1.018cqw; text-align:center; color:#636363; flex:none; }
  .rank-row.header .div{ color:#dedede; }
  .col-rank{ width:5.344cqw; flex:none; text-align:center; }
  .col-nick{
    display:flex; align-items:center; gap:0.509cqw;
    width:36.514cqw; flex:none;
  }
  .col-nick img{ width:5.089cqw; height:5.089cqw; object-fit:contain; flex:none; }
  .col-nick span{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .col-server{ width:12.977cqw; flex:none; text-align:center; }
  .col-tries{ width:11.196cqw; flex:none; text-align:center; }
  .col-jangi{ width:7.125cqw; flex:none; text-align:center; }
  .rank-empty{
    display:flex; align-items:center; justify-content:center;
    height:20.356cqw;
    color:#636363;
    font-size:3.053cqw;
  }

  .pagination{
    position:absolute;
    left:5.089cqw; top:167.557cqw;
    width:89.822cqw;
    display:flex; align-items:center; justify-content:center;
    gap:2.036cqw;
  }
  .page-arrow{
    display:flex; align-items:center; justify-content:center;
    width:5.089cqw; height:5.089cqw; flex:none;
    background:none; border:none; cursor:pointer; padding:0;
  }
  .page-arrow svg{ width:5.089cqw; height:2.290cqw; }
  .page-arrow.jump svg{ width:2.545cqw; height:2.545cqw; }
  .page-arrow:disabled{ opacity:0.3; cursor:default; }
  .page-num{
    width:4.835cqw; flex:none;
    padding:1.272cqw 0;
    background:none; border:none; cursor:pointer;
    font-family:inherit;
    font-weight:500;
    font-size:3.563cqw;
    color:#616161;
    text-shadow:0 0.509cqw 0.509cqw rgba(0,0,0,0.25);
  }
  .page-num.current{ font-weight:700; color:#dedede; }
  .page-num.wide{ width:auto; padding:1.272cqw 1.272cqw; }
  .page-ellipsis{
    width:5.089cqw; flex:none;
    text-align:center;
    font-size:3.563cqw;
    color:#616161;
    text-shadow:0 0.509cqw 0.509cqw rgba(0,0,0,0.25);
  }
</style>

<div class="viewport">
  <div class="frame">
    <h1 class="rank-title">전체 순위</h1>
    <p class="rank-summary" id="rankSummary"></p>

    <div class="rank-table" id="rankTable">
      <div class="rank-row header">
        <div class="col-rank">순위</div>
        <div class="div">|</div>
        <div class="col-nick">닉네임</div>
        <div class="div">|</div>
        <div class="col-server">서버</div>
        <div class="div">|</div>
        <div class="col-tries">시도 횟수</div>
        <div class="div">|</div>
        <div class="col-jangi">장기</div>
      </div>
      <div id="rankMeRow"></div>
      <div id="rankRows"></div>
    </div>

    <div class="pagination" id="pagination"></div>

    <div class="actions">
      <button class="action-btn" id="homeBtn">
        <img src="assets/icon-home.png" alt="" />
        <span>처음으로</span>
      </button>
      <button class="action-btn" id="retryBtn">
        <img src="assets/icon-retry.png" alt="" />
        <span>다시하기</span>
      </button>
    </div>
  </div>
</div>

<script type="module">
(function(){
  "use strict";
  var G = window.JGB_GAME;
  var PAGE_SIZE = 10;

  var params = new URLSearchParams(location.search);
  var page = parseInt(params.get('page'), 10);
  if(!page || page < 1) page = 1;

  document.getElementById('rankSummary').innerHTML =
    '순위는 ' + G.MAX_LEADERBOARD_RANK + '위까지 표시됩니다.<br>' +
    '매주 수요일 오전 10시에 초기화됩니다.';

  function iconSrc(job){
    return 'assets/icons/' + encodeURIComponent(job || '') + '.png';
  }

  function makeRow(rankNum, entry, isMe){
    var row = document.createElement('div');
    row.className = 'rank-row' + (isMe ? ' me' : '');
    row.innerHTML =
      '<div class="col-rank">' + rankNum + '</div>' +
      '<div class="div">|</div>' +
      '<div class="col-nick"><img src="' + iconSrc(entry.job) + '" alt="" onerror="this.style.visibility=\'hidden\'" />' +
        '<span>' + entry.nickname + '</span></div>' +
      '<div class="div">|</div>' +
      '<div class="col-server">' + entry.server + '</div>' +
      '<div class="div">|</div>' +
      '<div class="col-tries">' + entry.tries + '회</div>' +
      '<div class="div">|</div>' +
      '<div class="col-jangi">' + Math.round(entry.gauge) + '%</div>';
    return row;
  }

  var session = null;
  try{ session = JSON.parse(sessionStorage.getItem('jgb_session') || 'null'); }catch(e){}

  function chevronSvg(){
    return '<svg viewBox="0 0 25 15" fill="none"><path d="M2 2L12.5 12L23 2" stroke="#dedede" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function firstSvg(){
    return '<svg viewBox="0 0 20 20" fill="none"><path d="M3 2V18" stroke="#dedede" stroke-width="2.5" stroke-linecap="round"/><path d="M17 3L8 10L17 17" stroke="#dedede" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function lastSvg(){
    return '<svg viewBox="0 0 20 20" fill="none"><path d="M17 2V18" stroke="#dedede" stroke-width="2.5" stroke-linecap="round"/><path d="M3 3L12 10L3 17" stroke="#dedede" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function goToPage(p){ location.href = 'rank.html?page=' + p; }

  G.getLeaderboardCount().then(function(count){
    var totalPages = Math.max(1, Math.ceil(count / PAGE_SIZE));
    if(page > totalPages) page = totalPages;

    return Promise.all([
      count === 0 ? [] : G.getLeaderboardPage(page, PAGE_SIZE),
      (session && session.nickname) ? G.getMyRank(session.nickname, session.server) : null,
      totalPages
    ]);
  }).then(function(results){
    var pageItems = results[0];
    var myRank = results[1];
    var totalPages = results[2];

    var meRowEl = document.getElementById('rankMeRow');
    if(myRank){
      meRowEl.appendChild(makeRow(myRank.rank, myRank.entry, true));
    }

    var rowsEl = document.getElementById('rankRows');
    if(pageItems.length === 0){
      var empty = document.createElement('div');
      empty.className = 'rank-empty';
      empty.textContent = '아직 순위 기록이 없습니다.';
      rowsEl.appendChild(empty);
    }else{
      var start = (page - 1) * PAGE_SIZE;
      pageItems.forEach(function(entry, i){
        rowsEl.appendChild(makeRow(start + i + 1, entry, false));
      });
    }

    var pager = document.getElementById('pagination');

    function makePageBtn(p, wide){
      var btn = document.createElement('button');
      btn.className = 'page-num' + (p === page ? ' current' : '') + (wide ? ' wide' : '');
      btn.textContent = p;
      btn.addEventListener('click', function(){ goToPage(p); });
      return btn;
    }

    var firstBtn = document.createElement('button');
    firstBtn.className = 'page-arrow jump';
    firstBtn.innerHTML = firstSvg();
    firstBtn.disabled = page <= 1;
    firstBtn.addEventListener('click', function(){ goToPage(1); });
    pager.appendChild(firstBtn);

    var prevBtn = document.createElement('button');
    prevBtn.className = 'page-arrow';
    prevBtn.style.transform = 'rotate(90deg)';
    prevBtn.innerHTML = chevronSvg();
    prevBtn.disabled = page <= 1;
    prevBtn.addEventListener('click', function(){ goToPage(page - 1); });
    pager.appendChild(prevBtn);

    if(totalPages <= 5){
      for(var p = 1; p <= totalPages; p++){
        pager.appendChild(makePageBtn(p, false));
      }
    }else{
      var winStart = Math.min(Math.max(page - 2, 1), totalPages - 4);
      var winEnd = winStart + 4;

      for(var p = winStart; p <= winEnd; p++){
        pager.appendChild(makePageBtn(p, false));
      }

      if(winEnd < totalPages){
        var ellipsis = document.createElement('span');
        ellipsis.className = 'page-ellipsis';
        ellipsis.textContent = '•••';
        pager.appendChild(ellipsis);
        pager.appendChild(makePageBtn(totalPages, true));
      }
    }

    var nextBtn = document.createElement('button');
    nextBtn.className = 'page-arrow';
    nextBtn.style.transform = 'rotate(-90deg)';
    nextBtn.innerHTML = chevronSvg();
    nextBtn.disabled = page >= totalPages;
    nextBtn.addEventListener('click', function(){ goToPage(page + 1); });
    pager.appendChild(nextBtn);

    var lastBtn = document.createElement('button');
    lastBtn.className = 'page-arrow jump';
    lastBtn.innerHTML = lastSvg();
    lastBtn.disabled = page >= totalPages;
    lastBtn.addEventListener('click', function(){ goToPage(totalPages); });
    pager.appendChild(lastBtn);
  });

  document.getElementById('homeBtn').addEventListener('click', function(){
    location.href = 'index.html';
  });
  document.getElementById('retryBtn').addEventListener('click', function(){
    sessionStorage.removeItem('jgb_run');
    location.href = 'forge.html';
  });
})();
</script>
