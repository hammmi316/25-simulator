<title>재련 실패 - 무기 25강 시뮬레이터</title>
<script>
  if (!sessionStorage.getItem('jgb_session') || !sessionStorage.getItem('jgb_run')) { location.href = 'forge.html'; }
</script>
<link rel="stylesheet" href="assets/common.css" />
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-init.js"></script>
<script src="assets/game.js"></script>
<style>
  .frame{ background:#08070a; }

  .top-fade{
    position:absolute; left:0; top:0;
    width:100cqw; height:17.685cqw;
    background:linear-gradient(to bottom, #08070a 0%, transparent 100%);
  }
  .bottom-panel{
    position:absolute; left:0; top:82.826cqw; right:0; bottom:0;
    background:#08070a;
  }
  .art-main{
    position:absolute;
    left:0; top:-8.015cqw;
    width:100cqw; height:96.438cqw;
    object-fit:contain;
  }
  .art-bar{
    position:absolute;
    left:5.471cqw; top:54.707cqw;
    width:89.454cqw; height:8.143cqw;
    object-fit:contain;
  }
  .art-badge{
    position:absolute;
    left:35.522cqw; top:25.216cqw;
    width:29.084cqw; height:29.211cqw;
    object-fit:fill;
  }
  .art-icon23{
    position:absolute;
    left:37.913cqw; top:65.140cqw;
    width:24.300cqw; height:6.361cqw;
    object-fit:contain;
  }

  .fail-msg{
    position:absolute;
    left:0; top:87.534cqw;
    width:100cqw;
    margin:0;
    text-align:center;
    white-space:pre-line;
    font-size:4.071cqw;
    line-height:1.5;
    color:#72878f;
    text-shadow:0 1.018cqw 1.018cqw rgba(0,0,0,0.25);
  }
  .gauge-msg{
    position:absolute;
    left:0; top:112.113cqw;
    width:100cqw;
    margin:0;
    text-align:center;
    font-weight:700;
    font-size:4.071cqw;
    color:#dedede;
    text-shadow:0 0.509cqw 0.509cqw rgba(0,0,0,0.25);
  }
  .gauge-msg .delta{ color:#b4953a; }

  .confirm-btn{
    position:absolute;
    left:5.089cqw; top:141.730cqw;
    width:89.822cqw; height:15.267cqw;
    border:none; cursor:pointer;
    background:var(--btn-bg);
    box-shadow:inset 0 0.254cqw 0.509cqw rgba(255,255,255,0.25);
    color:#dedede;
    font-family:inherit;
    font-size:5.089cqw; font-weight:500;
    text-shadow:0 0.509cqw 0.509cqw rgba(0,0,0,0.25);
  }
  .confirm-btn:hover{ background:var(--btn-bg-hover); }
  .confirm-btn:active{ transform:translateY(1px) scale(0.995); }
</style>

<div class="viewport">
  <div class="frame">
    <img class="art-main" src="assets/fail-image22.png" alt="" />
    <img class="art-bar" src="assets/fail-image21.png" alt="" />
    <img class="art-badge" src="assets/fail-badge.png" alt="" />
    <img class="art-icon23" src="assets/fail-icon23.png" alt="" />
    <div class="bottom-panel"></div>
    <div class="top-fade"></div>

    <p class="fail-msg">재련에 실패하여 사용된 재료는 소멸되었습니다.
재련 실패로 상승하는 성공률은 0.50%를 초과하여
상승할 수 없습니다.</p>
    <p class="gauge-msg" id="gaugeMsg">장인의 기운 +0.47% 상승</p>

    <button class="confirm-btn" id="confirmBtn">확인</button>

    <p class="credit">made by. 따순미</p>
    <div class="actions">
      <button class="action-btn" id="homeBtn">
        <img src="assets/icon-home.png" alt="" />
        <span>처음으로</span>
      </button>
      <button class="action-btn" id="rankBtn">
        <img src="assets/icon-rank.png" alt="" />
        <span>순위보기</span>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var run = window.JGB_GAME.getRun();
  if(run){
    document.getElementById('gaugeMsg').innerHTML =
      '장인의 기운<span class="delta"> +' + run.lastDelta.toFixed(2) + '% 상승</span>';
  }

  document.getElementById('homeBtn').addEventListener('click', function(){
    location.href = 'index.html';
  });
  document.getElementById('rankBtn').addEventListener('click', function(){
    location.href = 'rank.html';
  });
  document.getElementById('confirmBtn').addEventListener('click', function(){
    location.href = 'forge.html';
  });
})();
</script>
